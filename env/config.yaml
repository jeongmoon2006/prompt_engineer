# staging-env reward configuration (toy domain, Phase 1).
reward:
  # Phase 2 rebalance (was 0.60/0.15/0.15/0.10): Haiku 5.5 saturates correctness on this domain, so the
  # learnable components (format, cost) carry more weight. Correctness stays in to penalize regressions.
  weights: { correctness: 0.40, format: 0.30, tool_efficiency: 0.10, cost: 0.20 }
  cost_lambda: 1.0
  token_budget: 4000
  n_max_tool_calls: 4
  numeric_scales: { temperature_K: 5.0, concentration_mM: 2.0 }
tasks:
  file: toy_v2.jsonl        # v1 = easy (saturated by Haiku 5.5), v2 = hard
  difficulty: hard
  seed: 1234
  n_total: 200
  n_train: 160
