# Root dev environment for running tests and the host-level smoke target.
# Containers use their own pyproject.toml under orchestrator/, harness/, env/.
[project]
name = "rl-prompt-opt"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "python-dotenv>=1.0", "matplotlib>=3.8", "datasets>=2.20"]
# Only needed to run the orchestrator's training code on the host (Phase 2+).
ml = ["torch>=2.4,<2.7", "transformers>=4.50", "peft>=0.12", "accelerate>=0.33"]

[tool.uv]
package = false

# CUDA 12.4 wheels: supports Turing (GTX 1660 Super, cc 7.5). Falls back to CPU where no GPU exists.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
